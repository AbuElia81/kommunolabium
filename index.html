<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kommunikationslabium</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e8e8ea;
      padding: 2rem;
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      margin: 0 0 0.4rem;
      letter-spacing: -0.02em;
      text-align: center;
    }
    p.sub { color: #9aa0aa; margin: 0 0 2.5rem; text-align: center; }
    .cards {
      display: grid;
      gap: 1.2rem;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      width: 100%;
      max-width: 640px;
    }
    a.card {
      display: block;
      padding: 1.6rem 1.4rem;
      border-radius: 14px;
      background: #1a1d27;
      border: 1px solid #2a2e3a;
      color: inherit;
      text-decoration: none;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    a.card:hover {
      transform: translateY(-3px);
      border-color: #4f7cff;
      background: #20242f;
    }
    a.card .icon { font-size: 2rem; display: block; margin-bottom: 0.6rem; }
    a.card .name { font-size: 1.2rem; font-weight: 600; }
    a.card .desc { color: #9aa0aa; font-size: 0.9rem; margin-top: 0.3rem; }
    footer { margin-top: 3rem; color: #5a5f6a; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>Kommunikationslabium</h1>
  <p class="sub">Wähle eine Seite</p>
  <div class="cards">
    <a class="card" href="kommunikationslabium.html">
      <span class="icon">🗣️</span>
      <span class="name">Kommunikationslabium</span>
      <span class="desc">Zur Seite &rarr;</span>
    </a>
    <a class="card" href="astrolabium.html">
      <span class="icon">🔭</span>
      <span class="name">Astrolabium</span>
      <span class="desc">Zur Seite &rarr;</span>
    </a>
    <a class="card" href="sprachkugel.html">
      <span class="icon">🔮</span>
      <span class="name">Sprachkugel</span>
      <span class="desc">Schalen und Pole &rarr;</span>
    </a>
  </div>
  <footer>Gehostet auf GitHub Pages</footer>
</body>
</html>
